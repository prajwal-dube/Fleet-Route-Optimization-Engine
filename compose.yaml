x-app: &app
  build: .
  environment:
    DATABASE_URL: postgresql://fleet:fleet@postgres:5432/fleet
  depends_on:
    postgres:
      condition: service_healthy
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      POSTGRES_DB: fleet
    volumes: [fleetdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U fleet -d fleet']
      interval: 2s
      timeout: 2s
      retries: 30
  migrate:
    <<: *app
    command: [python, -m, app.cli, migrate]
    restart: 'no'
  api:
    <<: *app
    ports: ['127.0.0.1:8081:8081']
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    <<: *app
    command: [python, -m, app.worker]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
  tests:
    <<: *app
    profiles: [tests]
    environment:
      DATABASE_URL: postgresql://fleet:fleet@postgres:5432/fleet
      INTEGRATION: '1'
    command: [python, -m, pytest, -q, -p, no:cacheprovider]
volumes:
  fleetdata:
